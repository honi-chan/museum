version: "2"

sql:
  - engine: "postgresql"

    schema:
      - "db/migrations"

    queries:
      - "db/query"

    gen:
      go:
        package: "sqlcgen"

        out: "internal/infrastructure/exhibition/sqlcgen"

        sql_package: "pgx/v5"

        emit_json_tags: false

        emit_prepared_queries: true

        emit_interface: true

        # DBのcreated_atはTIMESTAMPTZだが、
        # Application / Domainではtime.Timeとして扱う。
        #
        # DB型全体を変更するのではなく、
        # 対象columnを明示することで
        # 意図しない他テーブルへの影響を防ぐ。
        overrides:
          - column: "exhibitions.created_at"
            go_type: "time.Time"