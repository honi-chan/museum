openapi: 3.1.0

info:
  title: MUSEUM API
  version: 0.1.0

paths:
  /health:
    get:
      operationId: getHealth

      responses:
        "200":
          description: APIが正常に稼働している

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ----------------------------------------
  # Exhibition作成
  # ----------------------------------------
  /exhibitions:
    post:
      operationId: createExhibition

      summary: 展示室を作成する

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExhibitionRequest"

      responses:
        "201":
          description: 展示室作成成功

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExhibitionResponse"

        "400":
          description: リクエスト内容が不正

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: サーバー内部エラー

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ----------------------------------------
  # Exhibition取得
  #
  # /exhibitions の子要素ではなく、
  # paths直下の兄弟として定義する。
  # ----------------------------------------
  /exhibitions/{id}:
    get:
      # このoperationIdから
      #
      # GetExhibitionRequestObject
      # GetExhibitionResponseObject
      # GetExhibition(...)
      #
      # が生成される。
      operationId: getExhibition

      summary: 展示室を取得する

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: string

      responses:
        "200":
          description: 展示室取得成功

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExhibitionResponse"

        "404":
          description: 展示室が存在しない

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: サーバー内部エラー

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


components:
  schemas:
    HealthResponse:
      type: object

      required:
        - status

      properties:
        status:
          type: string

    CreateExhibitionRequest:
      type: object

      required:
        - museum_id
        - title

      properties:
        museum_id:
          type: string

        title:
          type: string

        description:
          type: string

    ExhibitionResponse:
      type: object

      required:
        - id
        - museum_id
        - title
        - description
        - created_at

      properties:
        id:
          type: string

        museum_id:
          type: string

        title:
          type: string

        description:
          type: string

        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object

      required:
        - error

      properties:
        error:
          type: string